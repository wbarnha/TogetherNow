name: Mobile builds

# The previous version ran `bunx cap sync android` and then `./gradlew` inside
# an `android/` directory that does not exist in this repository and is never
# created — Capacitor generates it. Both jobs could only ever fail, and
# `if-no-files-found: ignore` on the upload meant they failed quietly with a
# green-looking artifact step.
#
# The native projects are still generated rather than committed, so everything
# the App Store and Play Console need is applied from `native/app.json` by
# scripts/apply-native-config.mjs and then checked by
# scripts/verify-store-readiness.mjs. A build that would be rejected at upload
# fails here instead.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a signed release bundle (needs the keystore secrets)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"
  # A tag push is a release; a manual run is one only if asked for.
  RELEASE: ${{ github.event_name == 'push' || inputs.release }}

jobs:
  web:
    name: Web bundle for the native shells
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds, then renders the static shell Capacitor needs. Building once
      # here and sharing it means the two platform jobs cannot drift apart.
      - name: Build web output
        run: bun run build:mobile

      - name: Verify the shell Capacitor will copy
        run: |
          test -f .output/public/index.html \
            || { echo "::error::No entry point in webDir — the native app would open blank."; exit 1; }
          grep -q "<script" .output/public/index.html \
            || { echo "::error::Shell has no scripts — it would never hydrate."; exit 1; }

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mobile-web-output
          path: .output/public
          # `.output` is a dotted directory; without this the upload is empty.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: mobile-web-output
          path: .output/public

      # `cap sync` cannot run against a platform that was never added, and the
      # generated projects are not committed, so add it here.
      - name: Add and sync the Android platform
        run: |
          bunx cap add android
          bunx cap sync android

      # After `cap add`, not before. `cache: gradle` computes its key by
      # scanning for gradle files, and `android/` is generated here rather than
      # committed — so running this first found nothing and failed the job
      # outright with "No file ... matched to [**/*.gradle*...]". Java itself
      # installed fine; it was only the cache lookup that died, and it took the
      # whole Android build with it. Nothing before this point needs a JDK:
      # `cap add` copies a template and `cap sync` rewrites gradle files without
      # invoking gradle.
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          # Gradle's dependency cache is the slowest part of a cold Android
          # build; this alone saves minutes per run.
          cache: gradle

      # Permissions, backup policy, deep links, versions and release signing.
      - name: Apply store configuration
        run: bun run native:config

      - name: Verify Play requirements
        run: bun run store:check ${{ env.RELEASE == 'true' && '-- --release' || '' }}

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          # A missing APK means the build failed; do not pretend otherwise.
          if-no-files-found: error
          retention-days: 14

      # Play only accepts app bundles. This also proves the minified release
      # build compiles, which the debug build does not.
      - name: Decode the upload keystore
        if: env.RELEASE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release bundle has to be signed with your upload key — see STORE.md."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        if: env.RELEASE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      # Play takes the .aab, but an .aab cannot be installed on a phone — it is
      # not an APK and the installer rejects it with a parse error. Anyone
      # sideloading a real build rather than the debug one needs this.
      - name: Assemble signed release APK
        if: env.RELEASE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release bundle
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS (unsigned .ipa for sideloading)
    needs: web
    # macos-15 defaults to Xcode 16.4, whose newest iOS SDK is 18.5 — and since
    # 28 April 2026 App Store Connect rejects any upload built against an SDK
    # older than iOS 26. Sideloading has no such rule, so the job was producing
    # a binary that installed fine on a phone and could never be submitted, and
    # the failure would have surfaced at Apple rather than here.
    #
    # macos-26 (Tahoe) has been generally available since February 2026 and
    # defaults to Xcode 26.x. Both images are arm64, so this is a toolchain
    # change and not an architecture one.
    #
    # Pinned rather than `macos-latest`: the alias started moving to this image
    # on 15 June 2026 and took weeks to roll out, and a floating label is a
    # build that can change underneath you without a commit.
    #
    # macos-15 does also carry Xcode 26.x alongside its default, so an
    # `xcode-select` would have worked too — but it tops out at 26.3 against
    # this image's 26.6, and it leaves the build one image retirement away from
    # silently falling back to Xcode 16. The step below asserts the outcome
    # either way.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: mobile-web-output
          path: .output/public

      - name: Add and sync the iOS platform
        run: |
          bunx cap add ios
          bunx cap sync ios

      # Privacy manifest, usage strings, export compliance, URL scheme, version.
      - name: Apply store configuration
        run: bun run native:config

      - name: Verify App Store requirements
        run: bun run store:check ${{ env.RELEASE == 'true' && '-- --release' || '' }}

      # Capacitor 8 wires plugins through Swift Package Manager, so there is no
      # CocoaPods workspace to build — only the Xcode project. The previous
      # workflow passed `-workspace App.xcworkspace`, which does not exist.
      #
      # This builds for a *device*, not the simulator. The previous version
      # targeted `generic/platform=iOS Simulator`, which produces an x86_64 or
      # arm64-simulator binary that can never be installed on a phone — so the
      # job proved the code compiled and produced nothing anybody could run.
      - name: Build app for device (no code signing)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO build
          # Where the bundle landed, so the next two steps agree on it.
          echo "APP_BUNDLE=$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/App.app" \
            >> "$GITHUB_ENV"

      # The reason for the runner above, asserted rather than assumed. Xcode
      # bakes the SDK it built against into the app's Info.plist, and that is
      # the copy App Store Connect reads when it decides whether to accept an
      # upload — so checking it here checks the same thing Apple will, rather
      # than what the toolchain claims about itself. A runner image that rolls
      # backwards, or a stray `xcode-select`, fails the build instead of
      # producing an .ipa that is fine to sideload and impossible to submit.
      - name: Verify the build used a current iOS SDK
        env:
          # Apple's floor since 28 April 2026. Raise it when Apple does.
          MIN_IOS_SDK_MAJOR: "26"
        run: |
          set -euo pipefail
          plist="$APP_BUNDLE/Info.plist"
          test -f "$plist" || { echo "::error::No Info.plist at $plist"; exit 1; }
          key() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist" 2>/dev/null || true; }

          sdk=$(key DTSDKName)          # iphoneos26.0
          platform=$(key DTPlatformVersion)
          xcode=$(key DTXcode)
          echo "SDK ${sdk:-?} · platform ${platform:-?} · DTXcode ${xcode:-?}"
          xcodebuild -version

          major=${sdk#iphoneos}
          major=${major%%.*}
          case "$major" in
            "" | *[!0-9]*)
              echo "::error::Could not read an iOS SDK version from the built app (DTSDKName='$sdk')."
              exit 1
              ;;
          esac

          if [ "$major" -lt "$MIN_IOS_SDK_MAJOR" ]; then
            echo "::error::Built against the iOS $major SDK, but App Store Connect requires iOS $MIN_IOS_SDK_MAJOR or newer. This binary would be rejected at upload. Check the runner image and which Xcode is selected."
            exit 1
          fi
          echo "::notice::Built against the iOS $major SDK (${xcode:+DTXcode $xcode}), which App Store Connect accepts."

      - name: Package an unsigned .ipa
        run: |
          # An xcodebuild that succeeds without emitting a bundle is exactly the
          # failure this job used to ship, so assert rather than assume.
          test -d "$APP_BUNDLE" || { echo "::error::xcodebuild produced no App.app at $APP_BUNDLE"; exit 1; }
          ./scripts/package-ipa.sh "$APP_BUNDLE" "$RUNNER_TEMP/TogetherNow-unsigned.ipa"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/TogetherNow-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
