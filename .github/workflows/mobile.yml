name: Mobile builds

# The previous version ran `bunx cap sync android` and then `./gradlew` inside
# an `android/` directory that does not exist in this repository and is never
# created — Capacitor generates it. Both jobs could only ever fail, and
# `if-no-files-found: ignore` on the upload meant they failed quietly with a
# green-looking artifact step.
#
# The native projects are still generated rather than committed, so everything
# the App Store and Play Console need is applied from `native/app.json` by
# scripts/apply-native-config.mjs and then checked by
# scripts/verify-store-readiness.mjs. A build that would be rejected at upload
# fails here instead.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a signed release bundle (needs the keystore secrets)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"
  # A tag push is a release; a manual run is one only if asked for.
  RELEASE: ${{ github.event_name == 'push' || inputs.release }}

jobs:
  web:
    name: Web bundle for the native shells
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds, then renders the static shell Capacitor needs. Building once
      # here and sharing it means the two platform jobs cannot drift apart.
      - name: Build web output
        run: bun run build:mobile

      - name: Verify the shell Capacitor will copy
        run: |
          test -f .output/public/index.html \
            || { echo "::error::No entry point in webDir — the native app would open blank."; exit 1; }
          grep -q "<script" .output/public/index.html \
            || { echo "::error::Shell has no scripts — it would never hydrate."; exit 1; }

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: mobile-web-output
          path: .output/public
          # `.output` is a dotted directory; without this the upload is empty.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          # Gradle's dependency cache is the slowest part of a cold Android
          # build; this alone saves minutes per run.
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: mobile-web-output
          path: .output/public

      # `cap sync` cannot run against a platform that was never added, and the
      # generated projects are not committed, so add it here.
      - name: Add and sync the Android platform
        run: |
          bunx cap add android
          bunx cap sync android

      # Permissions, backup policy, deep links, versions and release signing.
      - name: Apply store configuration
        run: bun run native:config

      - name: Verify Play requirements
        run: bun run store:check ${{ env.RELEASE == 'true' && '-- --release' || '' }}

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          # A missing APK means the build failed; do not pretend otherwise.
          if-no-files-found: error
          retention-days: 14

      # Play only accepts app bundles. This also proves the minified release
      # build compiles, which the debug build does not.
      - name: Decode the upload keystore
        if: env.RELEASE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release bundle has to be signed with your upload key — see STORE.md."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        if: env.RELEASE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload release bundle
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS (unsigned build)
    needs: web
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: mobile-web-output
          path: .output/public

      - name: Add and sync the iOS platform
        run: |
          bunx cap add ios
          bunx cap sync ios

      # Privacy manifest, usage strings, export compliance, URL scheme, version.
      - name: Apply store configuration
        run: bun run native:config

      - name: Verify App Store requirements
        run: bun run store:check ${{ env.RELEASE == 'true' && '-- --release' || '' }}

      # Capacitor 8 wires plugins through Swift Package Manager, so there is no
      # CocoaPods workspace to build — only the Xcode project. The previous
      # workflow passed `-workspace App.xcworkspace`, which does not exist.
      - name: Build app (no code signing)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
