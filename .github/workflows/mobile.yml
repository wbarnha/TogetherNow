name: Mobile builds

# The previous version ran `bunx cap sync android` and then `./gradlew` inside
# an `android/` directory that does not exist in this repository and is never
# created — Capacitor generates it. Both jobs could only ever fail, and
# `if-no-files-found: ignore` on the upload meant they failed quietly with a
# green-looking artifact step. This version generates the platforms, gives
# Capacitor an entry point to copy, and fails loudly when a build produces
# nothing.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  web:
    name: Web bundle for the native shells
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds, then renders the static shell Capacitor needs. Building once
      # here and sharing it means the two platform jobs cannot drift apart.
      - name: Build web output
        run: bun run build:mobile

      - name: Verify the shell Capacitor will copy
        run: |
          test -f .output/public/index.html \
            || { echo "::error::No entry point in webDir — the native app would open blank."; exit 1; }
          grep -q "<script" .output/public/index.html \
            || { echo "::error::Shell has no scripts — it would never hydrate."; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-web-output
          path: .output/public
          if-no-files-found: error
          retention-days: 3

  android:
    name: Android (debug APK)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
          # Gradle's dependency cache is the slowest part of a cold Android
          # build; this alone saves minutes per run.
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-web-output
          path: .output/public

      # `cap sync` cannot run against a platform that was never added, and the
      # generated projects are not committed, so add it here.
      - name: Add and sync the Android platform
        run: |
          bunx cap add android
          bunx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          # A missing APK means the build failed; do not pretend otherwise.
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (unsigned build)
    needs: web
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-web-output
          path: .output/public

      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Add and sync the iOS platform
        run: |
          bunx cap add ios
          bunx cap sync ios

      - name: Build app (no code signing)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
