name: CI

# The previous version ran lint → typecheck → test → build as four steps of one
# job, so the very first lint failure meant nothing else ever ran: this repo has
# never had a passing typecheck, test or build in CI. Splitting them into
# independent jobs means one failure reports one failure, and every other check
# still tells you where you stand.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed on the PR when there is one, so a PR and its branch push do not run
  # twice against each other.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

env:
  # Pinned rather than `latest`, so a Bun release cannot turn CI red without a
  # commit explaining why.
  BUN_VERSION: "1.3.11"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      # Prettier is configured in this repo but was never verified anywhere, so
      # formatting drifted until `bun run lint` failed on it.
      - name: Prettier
        run: bun run format:check

      # Catches the store blockers that do not need a native project: a
      # placeholder bundle ID, a missing privacy policy URL, an App Group that
      # no longer matches. The rest are checked in the mobile workflow, against
      # the generated iOS and Android projects.
      - name: Store configuration
        run: bun run store:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: tsc --noEmit
        run: bun run typecheck

      # A stale generated route tree passes typecheck locally and then fails to
      # build. Catch the drift here instead.
      - name: Generated route tree is up to date
        run: |
          bun run build >/dev/null
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error file=src/routeTree.gen.ts::Route tree is stale — run 'bun run build' and commit the result."
            git --no-pager diff -- src/routeTree.gen.ts
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vitest
        run: bun run test -- --reporter=default --reporter=junit --outputFile=reports/junit.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-report
          path: reports/junit.xml
          retention-days: 7
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # A bundle regression is invisible until someone loads the app on a phone,
      # so the numbers go in the job summary on every run.
      - name: Report bundle size
        run: |
          {
            echo "### Client bundle"
            echo
            echo "| Chunk | Raw | Gzip |"
            echo "| --- | ---: | ---: |"
            total_raw=0
            total_gz=0
            while read -r size file; do
              gz=$(gzip -c "$file" | wc -c)
              total_raw=$((total_raw + size))
              total_gz=$((total_gz + gz))
              if [ "$size" -gt 20000 ]; then
                printf '| `%s` | %s kB | %s kB |\n' \
                  "$(basename "$file")" "$((size / 1024))" "$((gz / 1024))"
              fi
            done <<< "$(find .output/public -name '*.js' -printf '%s %p\n' | sort -rn)"
            printf '| **total** | **%s kB** | **%s kB** |\n' \
              "$((total_raw / 1024))" "$((total_gz / 1024))"
          } >> "$GITHUB_STEP_SUMMARY"

      # The app promises that nothing leaves the device, and it had been
      # loading webfonts from Google on every launch. This is a tripwire, not a
      # policy: every network host the bundle mentions has to be on the list
      # below, so a new one — an analytics snippet, a CDN, a font host — cannot
      # arrive without someone deliberately adding it here.
      #
      # What each host is for is documented in src/lib/security.ts (loaded
      # resources) and src/lib/app/{travel,places,messengers,assistants}.ts
      # (links the user taps).
      - name: No unreviewed outbound origins in the client bundle
        run: |
          reviewed="$(cat <<'HOSTS'
          chatgpt.com
          claude.ai
          discord.com
          discordapp.com
          github.com
          instagram.com
          leafletjs.com
          localhost
          maps.app.goo.gl
          maps.apple.com
          maps.google.com
          nominatim.openstreetmap.org
          react.dev
          t.me
          tile.openstreetmap.org
          togethernow.app
          wa.me
          www.amtrak.com
          www.google.com
          www.kayak.com
          www.omio.com
          www.openstreetmap.org
          www.rome2rio.com
          www.skyscanner.net
          www.w3.org
          HOSTS
          )"
          found=$(grep -rhoE 'https?://[a-zA-Z0-9.-]+' .output/public/assets/*.js \
            | sed -E 's#^https?://##' | sort -u)
          new=$(comm -23 <(echo "$found") <(echo "$reviewed" | sed 's/^ *//' | sort -u))
          if [ -n "$new" ]; then
            echo "::error::Unreviewed outbound origins in the client bundle:"
            echo "$new"
            echo "If these are intentional, add them to the list in this workflow."
            exit 1
          fi
          echo "No unreviewed outbound origins."

      - name: Upload build output
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: web-build-${{ github.sha }}
          path: .output
          # `.output` is a dotted directory, and upload-artifact skips hidden
          # paths by default — without this it uploads nothing at all.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
