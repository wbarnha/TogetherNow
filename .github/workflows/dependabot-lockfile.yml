name: Repair Dependabot lockfiles

# Dependabot cannot write `bun.lock`.
#
# Its npm ecosystem understands package-lock.json, yarn.lock and
# pnpm-lock.yaml. This repo has only bun.lock, so every npm pull request it
# opens edits package.json and leaves the lockfile untouched — and every CI job
# starts with `bun install --frozen-lockfile`, which correctly refuses:
#
#   error: lockfile had changes, but lockfile is frozen
#
# The result is that every dependency update is permanently red and unmergeable
# through no fault of the version being proposed. This job installs on those
# branches and commits the lockfile Dependabot could not produce.
#
# Why `schedule` and not `pull_request`: a workflow *triggered by Dependabot*
# receives a read-only GITHUB_TOKEN, so it could never push the fix. A
# scheduled run is not Dependabot-triggered and gets the permissions declared
# below. The alternative, `pull_request_target`, would run untrusted branch
# content in a privileged context and is not worth it for this.

on:
  schedule:
    # Two hours after Dependabot's Monday 06:00 window, so the branches exist.
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      pr:
        description: "Repair a single pull request number, instead of all open ones"
        required: false
        type: string

concurrency:
  group: dependabot-lockfile
  cancel-in-progress: false

permissions:
  contents: write # push the lockfile commit
  pull-requests: write # find the branches, and ask Dependabot to recreate one
  actions: write # a token push does not start CI, so start it explicitly

env:
  BUN_VERSION: "1.3.11"

jobs:
  repair:
    name: Commit the lockfile Dependabot could not
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Needed to push, and to fetch the Dependabot branches below.
          persist-credentials: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Repair each branch that changed package.json but not bun.lock
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "${ONLY_PR:-}" ]; then
            numbers="$ONLY_PR"
          else
            numbers=$(gh pr list --state open --author "app/dependabot" \
              --json number --jq '.[].number')
          fi

          if [ -z "$numbers" ]; then
            echo "No open Dependabot pull requests."
            exit 0
          fi

          repaired=0
          for n in $numbers; do
            branch=$(gh pr view "$n" --json headRefName --jq .headRefName)
            echo "::group::PR #$n ($branch)"

            # Only npm updates have a lockfile; action bumps never do.
            case "$branch" in
              dependabot/npm_and_yarn/*) ;;
              *) echo "not an npm update, skipping"; echo "::endgroup::"; continue ;;
            esac

            git fetch --quiet origin "$branch" main
            git checkout --quiet -B "$branch" "origin/$branch"

            # Bring the branch up to date first. A branch that is behind
            # resolves its lockfile against a stale package.json, and as soon as
            # one of these pull requests merges, every other one conflicts with
            # it.
            #
            # A bun.lock conflict is not a real conflict: the file is derived
            # entirely from package.json, so there is nothing to reconcile by
            # hand. Take either side to clear the merge and let `bun install`
            # overwrite it below.
            #
            # A conflict anywhere else — package.json especially, where two
            # dependency bumps routinely land on adjacent lines — is a real
            # disagreement, and this job has no business guessing at it. Hand it
            # back to Dependabot instead: `recreate` rebuilds the branch from
            # current main and reapplies the bump, which cannot conflict by
            # construction, and the next run of this job fixes the lockfile.
            if ! git merge --no-edit origin/main >/dev/null 2>&1; then
              unresolved=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
              if [ "$(echo "$unresolved" | tr -d ' ')" = "bun.lock" ]; then
                git checkout --ours -- bun.lock
                git add bun.lock
                git commit --no-edit --quiet
                echo "merged main; bun.lock conflict will be regenerated"
              else
                git merge --abort
                echo "::warning::#$n conflicts with main in: ${unresolved}— asking Dependabot to recreate it"
                # Built with printf rather than written inline: every line has
                # to stay indented inside this YAML block scalar, and a comment
                # body starting at column 0 silently ends the block.
                body=$(printf '%s\n' \
                  '`@dependabot recreate`' \
                  '' \
                  "This branch conflicts with \`main\` in: \`${unresolved}\`" \
                  '' \
                  'The lockfile-repair job only regenerates `bun.lock`, which is derived from `package.json` and so has nothing to reconcile by hand. A conflict in any other file is a real disagreement about intent, and the job does not guess at those.' \
                  '' \
                  'Recreating rebuilds this branch from current `main` and reapplies the version bump, which cannot conflict by construction. The lockfile is repaired on the next run of this job.' \
                  '' \
                  '---' \
                  '_Generated by [Claude Code](https://claude.ai/code)_')
                gh pr comment "$n" --body "$body" >/dev/null 2>&1 \
                  || echo "::warning::Could not comment on #$n."
                echo "::endgroup::"
                continue
              fi
            fi

            # Install without --frozen-lockfile: producing the lockfile is the
            # entire point. If bun disagrees with package.json for a reason
            # other than a stale lock, this fails here rather than silently
            # committing something wrong.
            bun install

            if git diff --quiet -- bun.lock; then
              echo "lockfile already correct"
            else
              git add bun.lock
              git commit -m "Update bun.lock for $branch

          Dependabot's npm ecosystem cannot write bun.lock, so it left the
          lockfile stale and CI refused the branch at --frozen-lockfile. This
          commit is what \`bun install\` produced on top of its package.json
          change; the dependency versions are Dependabot's, unchanged."
            fi

            # Decide what to push by comparing against the remote, not by
            # whether bun.lock moved: the merge above can produce a commit worth
            # pushing even when the lockfile comes out identical, and an early
            # exit keyed on the lockfile alone would throw that merge away and
            # leave the branch conflicting exactly as it was.
            if git diff --quiet "origin/$branch" HEAD; then
              echo "up to date with main and lockfile correct, nothing to push"
              echo "::endgroup::"
              continue
            fi

            git push origin "$branch"
            repaired=$((repaired + 1))

            # A push authenticated with GITHUB_TOKEN deliberately does not start
            # new workflow runs, which would otherwise be an easy way to build a
            # loop. CI therefore has to be started by hand.
            #
            # This used to re-request the head commit's check suites, which
            # quietly did nothing: the commit was created a moment ago by this
            # job, so it has no check suites to re-request. The branches ended
            # up with a correct lockfile and no checks at all, which reads as
            # "not run yet" rather than as a problem, and the pull requests sat
            # there looking like they were still waiting on CI.
            #
            # Dispatching the workflow explicitly does start a run. It is
            # attached to the branch head, so the resulting check runs land on
            # the same commit the pull request points at.
            gh workflow run ci.yml --ref "$branch" \
              || echo "::warning::Could not start CI on $branch; start it by hand."

            echo "::endgroup::"
          done

          echo "Repaired $repaired branch(es)."
          if [ "$repaired" -gt 0 ]; then
            echo "::notice::Committed bun.lock on $repaired Dependabot branch(es)."
          fi
